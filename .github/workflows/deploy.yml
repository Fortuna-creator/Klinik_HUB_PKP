name: Deploy to VPS on Merge/Push

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn -B -DskipTests clean package

      - name: Resolve deploy config from branch
        id: cfg
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "PROFILE=prod" >> $GITHUB_OUTPUT
            echo "APP_DIR=/var/www/spring-app-prod" >> $GITHUB_OUTPUT
            echo "SERVICE=spring-app-prod" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "PROFILE=dev" >> $GITHUB_OUTPUT
            echo "APP_DIR=/var/www/spring-app-dev" >> $GITHUB_OUTPUT
            echo "SERVICE=spring-app-dev" >> $GITHUB_OUTPUT
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      # Pick ONE jar and expose its full path + basename
      - name: Determine artifact
        id: art
        shell: bash
        run: |
          set -euo pipefail
          JAR_PATH="$(ls -t target/*.jar | head -1)"
          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_OUTPUT"
          echo "JAR_BASENAME=$(basename "$JAR_PATH")" >> "$GITHUB_OUTPUT"
          echo "Selected artifact: $JAR_PATH"

      - name: Upload artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: hub
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "${{ steps.art.outputs.JAR_PATH }}"     # single file
          target: "${{ steps.cfg.outputs.APP_DIR }}/"     # directory
          debug: true

      # Verify upload, point app.jar to latest, restart
      - name: Symlink and restart via systemd
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: hub
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            APP_DIR="${{ steps.cfg.outputs.APP_DIR }}"
            SERVICE="${{ steps.cfg.outputs.SERVICE }}"
            JAR="${{ steps.art.outputs.JAR_BASENAME }}"

            cd "$APP_DIR"
            if [ ! -f "$JAR" ]; then
              echo "Expected $APP_DIR/$JAR but it's not there"; ls -la; exit 1
            fi

            # symlink app.jar -> uploaded jar (atomic swap)
            ln -sfn "$JAR" app.jar
            ls -la

            # restart & confirm
            sudo -n /usr/bin/systemctl restart "$SERVICE"