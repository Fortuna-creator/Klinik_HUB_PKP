name: Deploy to VPS on Merge/Push

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Resolve deploy config from branch
        id: cfg
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "PROFILE=prod" >> $GITHUB_OUTPUT
            echo "APP_DIR=/var/www/spring-app-prod" >> $GITHUB_OUTPUT
            echo "SERVICE=spring-app-prod" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "PROFILE=dev" >> $GITHUB_OUTPUT
            echo "APP_DIR=/var/www/spring-app-dev" >> $GITHUB_OUTPUT
            echo "SERVICE=spring-app-dev" >> $GITHUB_OUTPUT
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Upload JAR to VPS (as files, not "app.jar" dir)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: "target/*.jar"
          target: "${{ steps.cfg.outputs.APP_DIR }}/"

      - name: Point app.jar to latest and restart
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: hub
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            APP_DIR="${{ steps.cfg.outputs.APP_DIR }}"
            SERVICE="${{ steps.cfg.outputs.SERVICE }}"
            cd "$APP_DIR"

            LATEST_JAR="$(ls -t *.jar 2>/dev/null | grep -v '^app\.jar$' | head -1 || true)"
            if [ -z "$LATEST_JAR" ]; then
              echo "No JAR uploaded to $APP_DIR"; exit 1
            fi

            ln -sfn "$LATEST_JAR" app.jar

            sudo -n /usr/bin/systemctl restart "$SERVICE"
