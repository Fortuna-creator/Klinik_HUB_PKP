spring:
  datasource:
    url: jdbc:h2:mem:hubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      javax.persistence.schema-generation.database.action: none

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin

jwt:
  secret: change-me
  expiration-ms: 3600000

server:
  port: 8080

simbg:
  base-url: https://api.simbg.go.id
  auth:
    token: ${SIMBG_TOKEN}

logging:
  pattern:
    console: "[yyyy-MM-dd HH:mm:ss.SSS] [%level] [%thread] [logger] - %msg%n"
