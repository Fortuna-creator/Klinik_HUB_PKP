spring:
  datasource:
    url: jdbc:postgresql://staging-db-host:5432/hubdb
    driverClassName: org.postgresql.Driver
    username: ${DB_USERNAME:staging_user}
    password: ${DB_PASSWORD:staging_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      javax.persistence.schema-generation.database.action: none
    show-sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

minio:
  endpoint: https://staging-minio.example.com
  access-key: ${MINIO_ACCESS_KEY:staging_access}
  secret-key: ${MINIO_SECRET_KEY:staging_secret}

jwt:
  secret: ${JWT_SECRET:staging-jwt-secret}
  expiration-ms: 1800000  # 30 minutes

server:
  port: 8080

logging:
  level:
    com.hub.app: INFO
    org.springframework.security: INFO